# ==============================================================================
# XorvilaBox - Production Nginx Reverse Proxy Configuration
# Optimized for high-throughput video streaming, HTTP Range requests & large uploads
# ==============================================================================

# Rate limiting zone for auth endpoints to prevent brute force
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

server {
    listen 80;
    server_name your-domain.com; # Replace with your VPS domain or IP

    # Redirect all HTTP traffic to HTTPS (Managed by Certbot)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name your-domain.com; # Replace with your VPS domain or IP

    # SSL Certificate configuration (Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Allow large anime video files and multi-gigabyte ZIP imports
    client_max_body_size 25G;
    client_body_buffer_size 128k;

    # Timeouts for large uploads and long streaming sessions
    client_body_timeout 3600s;
    send_timeout 3600s;
    keepalive_timeout 300s;

    # --------------------------------------------------------------------------
    # 1. Raw Stream Endpoint & Video Range Requests (/r/* and /:uid/*?raw=1)
    # --------------------------------------------------------------------------
    location /r/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Forward crucial Range request headers for video seeking (RFC 7233)
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # CRITICAL: Disable proxy buffering for instant media playback and seeking
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep streaming alive indefinitely
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }

    # --------------------------------------------------------------------------
    # 2. Large File Uploads & ZIP Imports
    # --------------------------------------------------------------------------
    location /api/files/upload {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Stream upload directly to Node.js without Nginx disk buffering
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }

    location /api/files/import-zip {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_request_buffering off;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 7200s;
    }

    # --------------------------------------------------------------------------
    # 3. Authentication endpoints (with rate limiting)
    # --------------------------------------------------------------------------
    location /api/auth/login {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 4. Standard Web Application & API Proxy
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (for dev or live stats)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
    }
}
